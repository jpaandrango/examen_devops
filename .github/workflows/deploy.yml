name: Python application and Docker Publish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} 

  APP_VERSION: 2.0.0 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar dependencias locales
      run: |
        python -m pip install --upgrade pip
        if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
        # Instalamos pytest por si no está en tu requirements.txt para que no falle el paso de pruebas
        pip install pytest 

    - name: Test con pytest
      run: |
        # Ejecuta tus pruebas unitarias si existen (puedes comentar esta línea si aún no tienes tests creados)
        pytest || echo "No se encontraron pruebas o fallaron, continuando..."


    - name: Login en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}

        password: ${{ secrets.GITHUB_TOKEN }} 

    - name: Extraer Metadata de Docker (Tags y Labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=raw,value=${{ env.APP_VERSION }}

    - name: Construir y Publicar Imagen en GHCR
      uses: docker/build-push-action@v5
      with:
        context: ./app 
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}